[tool.unasyncd]
remove_unused_imports = false
no_cache = false
force_regen = false
add_editors_note = true
exclude = [
    "Something",
    "SomethingElse.within"
]

[tool.unasyncd.files]
    "src/pystudernext/api_async.py" = "src/pystudernext/api_sync.py"
    "src/pystudernext/discover_async.py" = "src/pystudernext/discover_sync.py"
    "src/pystudernext/factory_async.py" = "src/pystudernext/factory_sync.py"
    "tests/test_api_async.py" = "tests/test_api_sync.py"
    "tests/test_datapoints_async.py" = "tests/test_datapoints_sync.py"
    "tests/test_discover_async.py" = "tests/test_discover_sync.py"
    "example_api_use_async.py" = "example_api_use.py"
    "example_discover_devices_async.py" = "example_discover_devices.py"
    "example_discover_gateway_async.py" = "example_discover_gateway.py"
    "example_menu_async.py" = "example_menu.py"

[tool.unasyncd.add_replacements]
    "AsyncNextApi" = "NextApi"
    "AsyncNextFactory" = "NextFactory"
    "AsyncNextDiscover" = "NextDiscover"
    "AsyncModbusTcpClient" = "ModbusTcpClient"
    "aiofiles_open" = "open"
    "httpx.AsyncClient" = "httpx.Client"
    "asyncio.Lock" = "threading.Lock"
    "aclose" = "close"
    "CALL_CONTEXT_ASYNC" = "CALL_CONTEXT_SYNC"
    "pytest_asyncio" = "pytest"
    "mark.asyncio" = "mark.syncio"
    "AsyncTaskHelper" = "TaskHelper"
    "AsyncNextApiStub" = "NextApiStub"
    "AsyncModbusClientStub" = "ModbusClientStub"
    "asyncio.as_completed" = "concurrent.futures.as_completed"

